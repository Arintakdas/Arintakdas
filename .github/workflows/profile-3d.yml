name: Generate Galaxy Profile

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

# 1. Explicitly grant write permissions
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Generate Galaxy SVG
        uses: vinimlo/galaxy-profile@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # 2. Automatically handle the commit, rebase, and push
      - name: Auto Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Galaxy Profile SVG"
          skip_fetch: true

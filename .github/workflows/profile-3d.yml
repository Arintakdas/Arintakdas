name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "5 0 * * *" # Staggered to prevent overlaps
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    
    # 1. THIS IS THE MAGIC BULLET: Forces GitHub to grant write access automatically
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 2. Replaces manual git config, add, commit, rebase, and push
      - name: Auto Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated 3D Graph Generation"
          skip_fetch: true
